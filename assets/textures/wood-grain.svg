<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <!-- Stretched noise that reads as wood grain on the desk. Original work, MIT licensed with the project. -->
  <filter id="w" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.12" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.07  0 0 0 0 0.03  0 0 0 0.55 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#w)"/>
</svg>
